<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر تمرین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#0c0b14;--field:#14121f;--ink:#e6e3ff;--mute:#8d89b3;--line:#2a2640;--acc:#8b7bff;--acc-ink:#0a0814;--pr:#c77dff;--err:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
a{color:var(--acc)}
h1,h2{color:var(--acc)}
.neon{font-family:'Tilt Neon',Vazirmatn,sans-serif;direction:ltr;text-align:center;font-size:clamp(2.2rem,12vw,3.6rem);letter-spacing:.08em;margin:28px 0 4px;color:#f1eeff;text-shadow:0 0 4px #fff,0 0 12px var(--acc),0 0 28px var(--acc),0 0 56px var(--acc)}
.sub{text-align:center;color:var(--mute);margin:0 0 22px}
button:not(.ghost){box-shadow:0 0 14px #8b7bff55}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.full{width:100%;margin-top:14px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row span{min-width:44px;color:var(--mute);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--field);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}.stat small{color:var(--mute)}
.stat.pr b{color:var(--pr)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list li:last-child{border:0}
.list .a{cursor:pointer;color:var(--acc);font-weight:600}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.2em;direction:ltr;display:inline-block;color:var(--acc)}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.mute{color:var(--mute);font-size:.9rem}
canvas{max-height:220px}
.seg button{padding:10px 6px}
.pick{max-height:220px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:4px 10px}.ck{display:flex;align-items:center;gap:10px;margin:0;padding:7px 0;color:var(--ink);font-size:.95rem}.ck input{width:auto}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.days button{padding:6px 10px;font-size:.85rem}
.ltr{direction:ltr}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ====== تنظیمات: این دو مقدار را عوض کنید ====== */
const SUPABASE_URL = "https://kywaoprjmsprkewoctfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y80j1Eh4WRYGO5_Fy8MSpw_49djTcBB";   // publishable key
/* ================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = d => new Date(d).toLocaleDateString("fa-IR");
const num = n => Number(n).toLocaleString("fa-IR");
const mail = u => `${u.trim().toLowerCase()}@gymapp.app`;
const app = $("#app");
let me = null, EX = [], charts = [];

function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ---------- ورود / ثبت‌نام ---------- */
function authView(mode="login", role="student"){
  const reg = mode==="register";
  app.innerHTML = `
  <div class="neon">GYMNASION</div><p class="sub">دفتر تمرین</p>
  ${!SUPABASE_KEY.startsWith("sb_")?'<div class="card err">کلید anon در فایل تنظیم نشده است.</div>':''}
  <div class="card">
    <h2>${reg?'ثبت‌نام':'ورود'}</h2>
    ${reg?`<label>نقش</label><div class="seg"><button class="${role==='student'?'':'ghost'}" id="rs">شاگرد</button><button class="${role==='coach'?'':'ghost'}" id="rc">مربی</button><button class="${role==='self'?'':'ghost'}" id="ro">تمرین شخصی</button></div>${role==='self'?'<p class="mute" style="margin:8px 0 0">بدون مربی؛ فقط تمرین‌ها و آمار خودتان.</p>':''}
    <label>نام و نام خانوادگی</label><input id="fn" autocomplete="name">`:''}
    <label>نام کاربری (انگلیسی)</label><input id="un" class="ltr" autocomplete="username" autocapitalize="none">
    <label>رمز عبور (حداقل ۶ کاراکتر)</label><input id="pw" type="password" class="ltr" autocomplete="${reg?'new-password':'current-password'}">
    ${reg&&role==='student'?'<label>کد دعوت مربی</label><input id="ic" class="ltr" autocapitalize="characters">':''}
    <div class="err" id="er"></div>
    <button class="full" id="go">${reg?'ساخت حساب':'ورود'}</button>
    <p class="mute" style="text-align:center;font-size:.8rem;margin:14px 0 0">${reg?'حساب داری؟ <a href="#" id="sw">ورود</a>':'حساب نداری؟ <a href="#" id="sw">ثبت‌نام</a>'}</p>
  </div>`;
  $("#sw").onclick=e=>{e.preventDefault();authView(reg?"login":"register",role)};
  if(reg){$("#rs").onclick=()=>authView("register","student");$("#rc").onclick=()=>authView("register","coach");$("#ro").onclick=()=>authView("register","self")}
  $("#go").onclick=async()=>{
    const er=$("#er"); er.textContent=""; const un=$("#un").value, pw=$("#pw").value;
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(un)){er.textContent="نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا _ باشد.";return}
    if(pw.length<6){er.textContent="رمز عبور باید حداقل ۶ کاراکتر باشد.";return}
    $("#go").disabled=true;
    let r;
    if(reg){
      const fn=$("#fn").value.trim(); if(!fn){er.textContent="نام را وارد کنید.";$("#go").disabled=false;return}
      const ic=role==='student'?$("#ic").value.trim():"";
      if(role==='student'&&!ic){er.textContent="کد دعوت را از مربی بگیرید.";$("#go").disabled=false;return}
      r=await sb.auth.signUp({email:mail(un),password:pw,options:{data:{username:un,full_name:fn,role,invite_code:ic}}});
      if(r.error) r.error={message:"Sign-up failed: "+r.error.message};
      else if(!r.data.session){
        const l=await sb.auth.signInWithPassword({email:mail(un),password:pw});
        if(l.error) r.error={message:"Account created but login failed: "+l.error.message+" (Is Confirm email still ON in Supabase?)"};
      }
    } else {
      r=await sb.auth.signInWithPassword({email:mail(un),password:pw});
      if(r.error) r.error={message:"Login failed: "+r.error.message};
    }
    $("#go").disabled=false;
    if(r.error){er.textContent=r.error.message;return}
    boot();
  };
}

/* ---------- شروع ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return authView();
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!p){await sb.auth.signOut();return authView()}
  me=p;
  const {data:ex}=await sb.from("exercises").select("*").order("name"); EX=ex||[];
  me.role==="coach"?coachView():studentView();
}
const head = t => `<header><h1>${t}</h1><button class="ghost" id="out">خروج</button></header>`;
function bindOut(){$("#out").onclick=async()=>{await sb.auth.signOut();me=null;authView()}}
const EQ={dumbbell:"دمبل",barbell:"هالتر",machine:"دستگاه"};
const exOptions = (f="") => EX.filter(e=>!f||e.equipment===f).map(e=>`<option value="${e.id}">${esc(e.name)}${e.equipment&&!e.name.includes(EQ[e.equipment])?` (${EQ[e.equipment]})`:""}</option>`).join("");
const eqSel = id => `<select id="${id}"><option value="">همه‌ی انواع</option>${Object.entries(EQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>`;

/* ---------- نمای مربی ---------- */
async function coachView(){
  app.innerHTML = head(`سلام مربی ${esc(me.full_name)}`)+`
  <div class="card"><h2>کد دعوت شما</h2><div class="code">${esc(me.invite_code)}</div>
  <p class="mute">این کد را به شاگردها بدهید تا هنگام ثبت‌نام وارد کنند.</p></div>
  <div class="card"><h2>شاگرد</h2><select id="stsel"><option value="">در حال بارگذاری…</option></select><div id="sp"></div></div>
  <div id="detail"></div>
  <div class="card"><h2>افزودن حرکت جدید</h2>
    <label>نام حرکت</label><input id="en"><label>عضله‌ی هدف</label><input id="em">
    <label>نوع حرکت</label><select id="ee"><option value="">بدون وزنه / سایر</option>${Object.entries(EQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
    <button class="full" id="ea">افزودن حرکت</button></div>`;
  bindOut();
  $("#ea").onclick=async()=>{
    const name=$("#en").value.trim(); if(!name) return;
    const {error}=await sb.from("exercises").insert({name,muscle_group:$("#em").value.trim(),equipment:$("#ee").value||null,created_by:me.id});
    if(error) return toast("افزودن حرکت انجام نشد");
    $("#en").value=$("#em").value="";
    const {data}=await sb.from("exercises").select("*").order("name"); EX=data||[]; toast("حرکت اضافه شد");
  };
  const {data:st}=await sb.from("profiles").select("id,full_name,username").eq("coach_id",me.id).order("created_at");
  const {data:ms}=await sb.from("memberships").select("*");
  const M={}; (ms||[]).forEach(m=>M[m.student_id]=m);
  const left=id=>{const m=M[id];return m&&m.total_sessions>0?m.total_sessions-m.used_sessions:null};
  const sel=$("#stsel");
  const fillSel=()=>{const cur=sel.value;
    sel.innerHTML=st&&st.length?'<option value="">انتخاب شاگرد…</option>'+st.map(x=>{const l=left(x.id);return `<option value="${x.id}">${esc(x.full_name)} — ${l===null?"جلسه تعیین نشده":num(Math.max(l,0))+" جلسه مانده"}</option>`}).join(""):'<option value="">هنوز شاگردی وصل نشده</option>';
    sel.value=cur};
  const show=()=>{
    const s=(st||[]).find(x=>x.id===sel.value), sp=$("#sp");
    if(!s){sp.innerHTML=st&&st.length?'<p class="mute">یک شاگرد را انتخاب کنید تا جلسه‌ها، برنامه و آمارش را ببینید.</p>':'<p class="mute">هنوز شاگردی وصل نشده. کد دعوت را برایشان بفرستید.</p>';return}
    const m=M[s.id]||{total_sessions:0,used_sessions:0}, l=m.total_sessions-m.used_sessions;
    sp.innerHTML=`<div class="stats" style="margin-top:12px"><div class="stat"><b>${num(m.total_sessions)}</b><small>کل جلسه</small></div><div class="stat"><b>${num(m.used_sessions)}</b><small>انجام‌شده</small></div><div class="stat ${m.total_sessions>0&&l<=2?"pr":""}"><b>${num(Math.max(l,0))}</b><small>باقی‌مانده</small></div></div>
    <div class="row"><button id="up" style="flex:1">+ یک جلسه انجام شد</button><button class="ghost" id="dn">برگردان</button></div>
    <label>تعداد کل جلسه‌ها</label>
    <div class="row"><input id="tot" type="number" min="0" inputmode="numeric" class="ltr" value="${m.total_sessions}"><button id="ts">ذخیره</button></div>
    <button class="ghost full" id="nw">بسته‌ی جدید (انجام‌شده‌ها صفر شود)</button>
    <div class="row" style="margin-top:14px"><button class="ghost" id="bp" style="flex:1">برنامه تمرین</button><button class="ghost" id="bs" style="flex:1">آمار</button></div>`;
    const save=async(t,u)=>{
      const r={student_id:s.id,total_sessions:Math.max(t,0),used_sessions:Math.max(u,0),updated_at:new Date().toISOString()};
      const {error}=await sb.from("memberships").upsert(r);
      if(error) return toast("ذخیره نشد");
      M[s.id]=r; fillSel(); show(); toast("ذخیره شد ✓");
    };
    const tot=()=>{const t=parseInt($("#tot").value);if(isNaN(t)||t<0){toast("عدد معتبر وارد کنید");return null}return t};
    $("#up").onclick=()=>{if(!m.total_sessions)return toast("اول تعداد کل جلسه‌ها را مشخص کنید");if(l<=0)return toast("جلسه‌ها تمام شده؛ بسته‌ی جدید بسازید");save(m.total_sessions,m.used_sessions+1)};
    $("#dn").onclick=()=>save(m.total_sessions,m.used_sessions-1);
    $("#ts").onclick=()=>{const t=tot();if(t!==null)save(t,Math.min(m.used_sessions,t))};
    $("#nw").onclick=()=>{const t=tot();if(t!==null)save(t,0)};
    const open=pl=>{$("#detail").innerHTML=`<div class="card"><h2>${pl?"برنامه":"آمار"} ${esc(s.full_name)}</h2><div id="sx"></div></div>`;
      pl?planEditor($("#sx"),s.id):statsView($("#sx"),s.id); $("#detail").scrollIntoView({behavior:"smooth"})};
    $("#bp").onclick=()=>open(true); $("#bs").onclick=()=>open(false);
  };
  sel.onchange=()=>{$("#detail").innerHTML="";show()};
  fillSel(); show();
}

/* ---------- نمای شاگرد ---------- */
function studentView(tab="log",pre=null){
  app.innerHTML = head(`سلام ${esc(me.full_name)}`)+`
  <div id="mem"></div><div class="tabs"><button class="${tab==='log'?'':'ghost'}" id="t1">ثبت تمرین</button><button class="${tab==='st'?'':'ghost'}" id="t2">پیشرفت من</button>${me.role==='self'?'':`<button class="${tab==='pl'?'':'ghost'}" id="t3">برنامه من</button>`}</div>
  <div id="body"></div>`;
  bindOut(); if(me.role!=="self") memBanner(); $("#t1").onclick=()=>studentView("log"); $("#t2").onclick=()=>studentView("st"); if($("#t3")) $("#t3").onclick=()=>studentView("pl");
  if(tab==="st"){ $("#body").innerHTML='<div class="card" id="sx"></div>'; statsView($("#sx"),me.id); }
  else if(tab==="pl") planView(); else logView(pre);
}

function setRow(i,w="",r=""){
  return `<div class="row" data-set><span>ست ${num(i)}</span>
  <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="کیلو" class="w ltr" value="${w}">
  <input type="number" inputmode="numeric" min="1" placeholder="تکرار" class="r ltr" value="${r}"></div>`;
}
function logView(pre=null){
  if(!EX.length){$("#body").innerHTML='<div class="card">هنوز حرکتی تعریف نشده. از مربی بخواهید حرکت اضافه کند.</div>';return}
  $("#body").innerHTML=`<div class="card"><h2>تمرین جدید</h2>
  <label>تاریخ</label><input type="date" id="dt" class="ltr" value="${new Date().toISOString().slice(0,10)}">
  <label>نوع حرکت</label>${eqSel("eq")}
  <label>حرکت</label><select id="ex">${exOptions()}</select>
  <div id="sets">${setRow(1)}</div>
  <button class="ghost full" id="add">+ ست جدید</button>
  <button class="full" id="save">ذخیره</button></div>
  <div class="card"><h2>آخرین ست‌ها</h2><ul class="list" id="hist"></ul></div>`;
  $("#add").onclick=()=>{
    const rows=document.querySelectorAll("[data-set]"), last=rows[rows.length-1];
    $("#sets").insertAdjacentHTML("beforeend",setRow(rows.length+1,last.querySelector(".w").value,last.querySelector(".r").value));
  };
  $("#eq").onchange=()=>{$("#ex").innerHTML=exOptions($("#eq").value)};
  $("#save").onclick=saveSets; loadHist();
  if(me.role==="self"){const d=document.createElement("div");$("#body").appendChild(d);exForm(d)}
  if(pre){$("#ex").value=pre.ex;$("#sets").innerHTML=Array.from({length:Math.min(pre.sets,10)},(_,i)=>setRow(i+1)).join("")}
}
async function saveSets(){
  const date=$("#dt").value, exId=+$("#ex").value;
  const rows=[...document.querySelectorAll("[data-set]")].map(r=>({w:parseFloat(r.querySelector(".w").value),r:parseInt(r.querySelector(".r").value)})).filter(x=>x.w>=0&&x.r>0);
  if(!date||!exId||!rows.length) return toast("وزنه و تکرار را وارد کنید");
  $("#save").disabled=true;
  let {data:w}=await sb.from("workouts").select("id").eq("student_id",me.id).eq("workout_date",date).limit(1);
  let wid=w&&w[0]?w[0].id:null;
  if(!wid){const {data:n,error}=await sb.from("workouts").insert({student_id:me.id,workout_date:date}).select("id").single();
    if(error){$("#save").disabled=false;return toast("ذخیره نشد")} wid=n.id}
  const {count}=await sb.from("sets").select("id",{count:"exact",head:true}).eq("workout_id",wid).eq("exercise_id",exId);
  const {error}=await sb.from("sets").insert(rows.map((x,i)=>({workout_id:wid,exercise_id:exId,set_number:(count||0)+i+1,weight_kg:x.w,reps:x.r})));
  $("#save").disabled=false;
  if(error) return toast("ذخیره نشد");
  toast("ذخیره شد ✓"); $("#sets").innerHTML=setRow(1); loadHist();
}
async function loadHist(){
  const {data}=await sb.from("sets").select("weight_kg,reps,set_number,exercises(name),workouts!inner(workout_date)").order("id",{ascending:false}).limit(12);
  $("#hist").innerHTML=data&&data.length?data.map(s=>`<li><span>${esc(s.exercises.name)} <span class="mute">${fa(s.workouts.workout_date)}</span></span><span>${num(s.weight_kg)} کیلو × ${num(s.reps)}</span></li>`).join(""):'<li class="mute">هنوز ستی ثبت نشده.</li>';
}

/* ---------- آمار و نمودار ---------- */
function statsView(el,sid){
  if(!EX.length){el.innerHTML='<p class="mute">حرکتی تعریف نشده.</p>';return}
  el.innerHTML=`<label>نوع حرکت</label>${eqSel("sx-eq")}<label>حرکت</label><select id="sx-ex">${exOptions()}</select><div id="sx-out" style="margin-top:12px"></div>`;
  const draw=async()=>{
    charts.forEach(c=>c.destroy()); charts=[];
    const out=$("#sx-out");
    if(!$("#sx-ex").value){out.innerHTML='<p class="mute">حرکتی در این دسته نیست.</p>';return}
    out.innerHTML='<p class="mute">در حال بارگذاری…</p>';
    const {data,error}=await sb.from("sets").select("weight_kg,reps,workouts!inner(workout_date,student_id)").eq("exercise_id",+$("#sx-ex").value).eq("workouts.student_id",sid);
    if(error||!data.length){out.innerHTML='<p class="mute">برای این حرکت هنوز داده‌ای ثبت نشده.</p>';return}
    const by={}; data.forEach(s=>{const d=s.workouts.workout_date,o=by[d]||(by[d]={max:0,vol:0,reps:0});
      o.max=Math.max(o.max,+s.weight_kg);o.vol+=s.weight_kg*s.reps;o.reps+=s.reps});
    const days=Object.keys(by).sort(), labels=days.map(fa);
    const pr=Math.max(...days.map(d=>by[d].max)), tv=days.reduce((a,d)=>a+by[d].vol,0);
    out.innerHTML=`<div class="stats"><div class="stat pr"><b>${num(pr)}</b><small>رکورد (کیلو)</small></div>
      <div class="stat"><b>${num(days.length)}</b><small>جلسه</small></div>
      <div class="stat"><b>${num(Math.round(tv))}</b><small>حجم کل</small></div></div>
      <h2>بیشترین وزنه هر جلسه (کیلو)</h2><canvas id="c1"></canvas>
      <h2 style="margin-top:16px">حجم تمرین (وزنه × تکرار)</h2><canvas id="c2"></canvas>
      <h2 style="margin-top:16px">مجموع تکرار</h2><canvas id="c3"></canvas>`;
    const css=getComputedStyle(document.documentElement), acc=css.getPropertyValue("--acc").trim(), grid=css.getPropertyValue("--line").trim(), txt=css.getPropertyValue("--mute").trim();
    const mk=(id,type,vals,color)=>charts.push(new Chart($(id),{type,data:{labels,datasets:[{data:vals,borderColor:color,backgroundColor:color+(type==="bar"?"":"33"),tension:.25,fill:type==="line",pointRadius:4}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:txt},grid:{color:grid}},y:{ticks:{color:txt},grid:{color:grid},beginAtZero:type==="bar"}}}}));
    mk("#c1","line",days.map(d=>by[d].max),acc);
    mk("#c2","bar",days.map(d=>by[d].vol),acc);
    mk("#c3","line",days.map(d=>by[d].reps),css.getPropertyValue("--pr").trim());
  };
  $("#sx-eq").onchange=()=>{$("#sx-ex").innerHTML=exOptions($("#sx-eq").value);draw()};
  $("#sx-ex").onchange=draw; draw();
}

async function memBanner(){
  const {data:m}=await sb.from("memberships").select("total_sessions,used_sessions").eq("student_id",me.id).maybeSingle();
  const el=$("#mem"); if(!el) return;
  if(!m||!m.total_sessions){el.innerHTML='<div class="card mute">مربی هنوز تعداد جلسه‌های شما را مشخص نکرده.</div>';return}
  const l=Math.max(m.total_sessions-m.used_sessions,0), pct=Math.min(100,Math.round(m.used_sessions/m.total_sessions*100));
  el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span>جلسه‌های باقی‌مانده</span><b style="font-size:1.4rem;color:${l<=2?"var(--pr)":"var(--acc)"}">${num(l)} از ${num(m.total_sessions)}</b></div>
  <div style="height:6px;background:var(--field);border-radius:3px;margin-top:8px"><div style="height:100%;width:${pct}%;background:var(--acc);border-radius:3px"></div></div>
  ${l===0?'<div class="mute" style="margin-top:6px">جلسه‌های شما تمام شده؛ با مربی هماهنگ کنید.</div>':l<=2?'<div class="mute" style="margin-top:6px">جلسه‌های شما رو به اتمام است.</div>':""}</div>`;
}

function exForm(el){
  el.innerHTML=`<div class="card"><h2>افزودن حرکت شخصی</h2><label>نام حرکت</label><input id="en"><label>عضله‌ی هدف</label><input id="em">
  <label>نوع حرکت</label><select id="ee"><option value="">بدون وزنه / سایر</option>${Object.entries(EQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
  <button class="full" id="ea">افزودن حرکت</button><p class="mute">این حرکت فقط برای خودتان نمایش داده می‌شود.</p></div>`;
  $("#ea").onclick=async()=>{
    const name=$("#en").value.trim(); if(!name) return;
    const {error}=await sb.from("exercises").insert({name,muscle_group:$("#em").value.trim(),equipment:$("#ee").value||null,created_by:me.id});
    if(error) return toast("افزودن حرکت انجام نشد");
    const {data}=await sb.from("exercises").select("*").order("name"); EX=data||[];
    toast("حرکت اضافه شد"); logView();
  };
}

/* ---------- برنامه تمرینی ---------- */
const DAYS=["روز اول","روز دوم","روز سوم","روز چهارم","روز پنجم","روز ششم","روز هفتم"];
const planLine=p=>`${esc(p.exercises.name)} <span class="mute">${num(p.sets)} ست × ${esc(p.reps)}${p.note?` (${esc(p.note)})`:""}</span>`;

async function planEditor(el,sid){
  let day=0;
  const render=async()=>{
    const {data}=await sb.from("plan_items").select("id,sets,reps,note,exercises(name)").eq("student_id",sid).eq("day_index",day).order("position").order("id");
    el.innerHTML=`<div class="days">${DAYS.map((d,i)=>`<button class="${i===day?'':'ghost'}" data-d="${i}">${d}</button>`).join("")}</div>
    <ul class="list">${data&&data.length?data.map(p=>`<li><span>${planLine(p)}</span><span class="a" data-del="${p.id}">حذف</span></li>`).join(""):'<li class="mute">برای این روز برنامه‌ای نیست.</li>'}</ul>
    <label>نوع حرکت</label>${eqSel("pe")}<label>حرکت‌ها (چند مورد را تیک بزنید)</label><div class="pick" id="px"></div>
    <div class="row"><input id="ps" type="number" min="1" value="3" class="ltr" placeholder="ست"><input id="pr" value="10" class="ltr" placeholder="تکرار"></div>
    <label>توضیح (اختیاری)</label><input id="pn">
    <button class="full" id="pa">افزودن به ${DAYS[day]}</button>`;
    el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()});
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await sb.from("plan_items").delete().eq("id",+b.dataset.del);render()});
    const fillPick=()=>{const f=$("#pe").value;$("#px").innerHTML=EX.filter(e=>!f||e.equipment===f).map(e=>`<label class="ck"><input type="checkbox" value="${e.id}"> ${esc(e.name)}${e.equipment&&!e.name.includes(EQ[e.equipment])?` (${EQ[e.equipment]})`:""}</label>`).join("")||'<span class="mute">حرکتی نیست.</span>'};
    $("#pe").onchange=fillPick; fillPick();
    $("#pa").onclick=async()=>{
      const ids=[...$("#px").querySelectorAll("input:checked")].map(i=>+i.value); if(!ids.length) return toast("حداقل یک حرکت انتخاب کنید");
      const {error}=await sb.from("plan_items").insert(ids.map((ex,i)=>({student_id:sid,day_index:day,exercise_id:ex,sets:+$("#ps").value||3,reps:$("#pr").value.trim()||"10",note:$("#pn").value.trim()||null,position:(data?data.length:0)+i})));
      if(error) return toast("افزودن نشد");
      toast("اضافه شد ✓"); render();
    };
  };
  render();
}

async function planView(){
  $("#body").innerHTML='<div class="card mute">در حال بارگذاری…</div>';
  const {data}=await sb.from("plan_items").select("day_index,sets,reps,note,exercise_id,exercises(name)").eq("student_id",me.id).order("position").order("id");
  const cards=DAYS.map((d,i)=>{
    const it=(data||[]).filter(x=>x.day_index===i); if(!it.length) return "";
    return `<div class="card"><h2>${d}</h2><ul class="list">${it.map(p=>`<li><span>${planLine(p)}</span><span class="a" data-ex="${p.exercise_id}" data-s="${p.sets}">ثبت</span></li>`).join("")}</ul></div>`;
  }).join("");
  $("#body").innerHTML=cards||'<div class="card">مربی هنوز برنامه‌ای برای شما نگذاشته.</div>';
  document.querySelectorAll("#body .a").forEach(a=>a.onclick=()=>studentView("log",{ex:a.dataset.ex,sets:+a.dataset.s}));
}

boot();
