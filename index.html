<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر تمرین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#151518;--card:#1e1e23;--field:#2a2a31;--ink:#ecebf5;--mute:#9a98ad;--line:#3a3a42;--acc:#8b7bff;--acc-ink:#0a0814;--pr:#c77dff;--err:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
a{color:var(--acc)}
h1,h2{color:var(--acc)}
.neon{font-family:'Tilt Neon',Vazirmatn,sans-serif;direction:ltr;text-align:center;font-size:clamp(2.2rem,12vw,3.6rem);letter-spacing:.08em;margin:28px 0 4px;color:#f1eeff;text-shadow:0 0 4px #fff,0 0 12px var(--acc),0 0 28px var(--acc),0 0 56px var(--acc)}
.sub{text-align:center;color:var(--mute);margin:0 0 22px}
button:not(.ghost){box-shadow:0 0 14px #8b7bff55}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.full{width:100%;margin-top:14px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tabs button{flex:1 1 auto;padding:10px 8px;font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row span{min-width:44px;color:var(--mute);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--field);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}.stat small{color:var(--mute)}
.stat.pr b{color:var(--pr)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list li:last-child{border:0}
.list .a{cursor:pointer;color:var(--acc);font-weight:600}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.2em;direction:ltr;display:inline-block;color:var(--acc)}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.mute{color:var(--mute);font-size:.9rem}
canvas{max-height:220px}
.seg button{padding:10px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{display:block;color:var(--acc);font-size:.7rem;min-height:1em;margin-top:2px}
.row>input{flex:1;min-width:0}
.row[data-set]{align-items:flex-start}.row[data-set]>span{padding-top:10px}
textarea{resize:vertical}
.desc{color:var(--mute);font-size:.8rem;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mute);font-weight:600}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;color:var(--acc);font-weight:600}
.dr-bg{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:19}.dr-bg.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:260px;max-width:80vw;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:20;padding:18px 14px;display:flex;flex-direction:column;gap:8px}.dr.open{transform:none;box-shadow:-8px 0 30px #000a}
.intro{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;text-align:center}
.bell,.ecg{width:min(300px,80vw);filter:drop-shadow(0 0 4px #8b7bff) drop-shadow(0 0 12px #8b7bff) drop-shadow(0 0 26px #6a5bff)}
.bell :is(path,rect),.ecg path{fill:none;stroke:#d8d2ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease forwards}
.ecg path{animation-delay:.9s}
.lift{animation:lift 1.6s ease-in-out 1.4s infinite}
.fl{animation:flick 3s steps(1) infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bell :is(path,rect),.ecg path,.lift,.fl,.dr,.dr-bg{animation:none;transition:none;stroke-dashoffset:0}}
body.auth-bg{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.8)),url(bg.jpg) center/cover no-repeat,#151518;min-height:100vh}
.pick{max-height:220px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:4px 10px}.ck{display:flex;align-items:center;gap:10px;margin:0;padding:7px 0;color:var(--ink);font-size:.95rem}.ck input{width:auto}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.days button{padding:6px 10px;font-size:.85rem}
.ltr{direction:ltr}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ====== تنظیمات: این دو مقدار را عوض کنید ====== */
const SUPABASE_URL = "https://kywaoprjmsprkewoctfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y80j1Eh4WRYGO5_Fy8MSpw_49djTcBB";   // publishable key
/* ================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = d => new Date(d).toLocaleDateString("fa-IR");
const num = n => Number(n).toLocaleString("fa-IR");
const mail = u => `${u.trim().toLowerCase()}@gymapp.app`;
const app = $("#app");
let me = null, EX = [], charts = [];

function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ---------- ورود / ثبت‌نام ---------- */
function authView(mode="login", role="student"){
  const reg = mode==="register"; document.body.classList.add("auth-bg");
  app.innerHTML = `
  <div class="neon">GYMNASION</div><p class="sub">دفتر تمرین</p>
  ${!SUPABASE_KEY.startsWith("sb_")?'<div class="card err">کلید anon در فایل تنظیم نشده است.</div>':''}
  <div class="card">
    <h2>${reg?'ثبت‌نام':'ورود'}</h2>
    ${reg?`<label>نقش</label><div class="seg"><button class="${role==='student'?'':'ghost'}" id="rs">شاگرد</button><button class="${role==='coach'?'':'ghost'}" id="rc">مربی</button><button class="${role==='self'?'':'ghost'}" id="ro">تمرین شخصی</button></div>${role==='self'?'<p class="mute" style="margin:8px 0 0">بدون مربی؛ فقط تمرین‌ها و آمار خودتان.</p>':''}
    <label>نام و نام خانوادگی</label><input id="fn" autocomplete="name">`:''}
    <label>نام کاربری (انگلیسی)</label><input id="un" class="ltr" autocomplete="username" autocapitalize="none">
    <label>رمز عبور (حداقل ۶ کاراکتر)</label><input id="pw" type="password" class="ltr" autocomplete="${reg?'new-password':'current-password'}">
    ${reg&&role==='student'?'<label>کد دعوت مربی</label><input id="ic" class="ltr" autocapitalize="characters">':''}
    <div class="err" id="er"></div>
    <button class="full" id="go">${reg?'ساخت حساب':'ورود'}</button>
    <p class="mute" style="text-align:center;font-size:.8rem;margin:14px 0 0">${reg?'حساب داری؟ <a href="#" id="sw">ورود</a>':'حساب نداری؟ <a href="#" id="sw">ثبت‌نام</a> &nbsp;|&nbsp; <a href="#" id="fg">فراموشی رمز</a>'}</p>
  </div>`;
  $("#sw").onclick=e=>{e.preventDefault();authView(reg?"login":"register",role)};
  if($("#fg")) $("#fg").onclick=e=>{e.preventDefault();forgotView()};
  if(reg){$("#rs").onclick=()=>authView("register","student");$("#rc").onclick=()=>authView("register","coach");$("#ro").onclick=()=>authView("register","self")}
  $("#go").onclick=async()=>{
    const er=$("#er"); er.textContent=""; const un=$("#un").value, pw=$("#pw").value;
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(un)){er.textContent="نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا _ باشد.";return}
    if(pw.length<6){er.textContent="رمز عبور باید حداقل ۶ کاراکتر باشد.";return}
    $("#go").disabled=true;
    let r;
    if(reg){
      const fn=$("#fn").value.trim(); if(!fn){er.textContent="نام را وارد کنید.";$("#go").disabled=false;return}
      const ic=role==='student'?$("#ic").value.trim():"";
      if(role==='student'&&!ic){er.textContent="کد دعوت را از مربی بگیرید.";$("#go").disabled=false;return}
      r=await sb.auth.signUp({email:mail(un),password:pw,options:{data:{username:un,full_name:fn,role,invite_code:ic}}});
      if(r.error) r.error={message:"Sign-up failed: "+r.error.message};
      else if(!r.data.session){
        const l=await sb.auth.signInWithPassword({email:mail(un),password:pw});
        if(l.error) r.error={message:"Account created but login failed: "+l.error.message+" (Is Confirm email still ON in Supabase?)"};
      }
    } else {
      r=await sb.auth.signInWithPassword({email:mail(un),password:pw});
      if(r.error) r.error={message:"Login failed: "+r.error.message};
    }
    $("#go").disabled=false;
    if(r.error){er.textContent=r.error.message;return}
    if(reg){const {data:c}=await sb.rpc("make_recovery_code"); if(c){app.innerHTML='<div class="neon" style="font-size:2rem">GYMNASION</div>'+recoveryCard(c)+'<button class="full" id="rk">ذخیره کردم، ادامه</button>';$("#rk").onclick=boot;return}}
    boot();
  };
}

/* ---------- شروع ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return introView();
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!p){await sb.auth.signOut();return authView()}
  me=p; document.body.classList.remove("auth-bg");
  const {data:ex}=await sb.from("exercises").select("*").order("name"); EX=ex||[];
  me.role==="coach"?coachView():studentView();
}
const head = (t,sub="") => `<header><div><h1>${t}</h1>${sub?`<small class="mute" style="font-size:.72rem">${sub}</small>`:""}</div><button class="ghost" id="out">خروج</button></header>`;
function bindOut(){$("#out").onclick=async()=>{await sb.auth.signOut();me=null;authView()}}
const EQ={dumbbell:"دمبل",barbell:"هالتر",machine:"دستگاه",bodyweight:"وزن بدن"};
const MUSCLES=["سینه","پشت","سرشانه","جلو بازو","پشت بازو","پا","پشت پا","باسن","ساق","کول","کمر","شکم"];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const exName=e=>esc(e.name)+(e.name_en?` | ${esc(e.name_en)}`:"");
const exFilter=(f="",m="",q="")=>EX.filter(e=>(!f||e.equipment===f)&&(!m||e.muscle_group===m)&&(!q||(e.name+" "+(e.name_en||"")).toLowerCase().includes(q.trim().toLowerCase())));
const exOptions=(f="",m="",q="")=>exFilter(f,m,q).map(e=>`<option value="${e.id}">${exName(e)}</option>`).join("");
const eqSel=id=>`<select id="${id}"><option value="">همه‌ی انواع</option>${Object.entries(EQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>`;
const mgSel=id=>`<select id="${id}"><option value="">همه‌ی عضلات</option>${MUSCLES.map(m=>`<option>${m}</option>`).join("")}</select>`;
function filt(e,m,q){return `<div class="two"><div><label>عضله‌ی هدف</label>${mgSel(m)}</div><div><label>نوع حرکت</label>${eqSel(e)}</div></div><label>جستجو</label><input id="${q}" placeholder="نام حرکت (فارسی یا انگلیسی)">`}
function bindFilt(e,m,q,fn){$("#"+e).onchange=fn;$("#"+m).onchange=fn;$("#"+q).oninput=fn}
/* ---------- نمای مربی ---------- */
async function coachView(){
  app.innerHTML = head(`سلام مربی ${esc(me.full_name)}`,`کد دعوت: <b class="ltr" style="color:var(--acc);letter-spacing:.08em">${esc(me.invite_code)}</b>`)+`
  <div class="card"><h2>شاگرد</h2><select id="stsel"><option value="">در حال بارگذاری…</option></select><div id="sp"></div></div>
  <div id="detail"></div>
  ${exFormHtml("افزودن حرکت جدید")}<button class="ghost full" id="rcc">ساخت کد بازیابی رمز</button>`;
  bindOut();
  bindExForm(()=>{$("#en").value=$("#ene").value=""});
  $("#rcc").onclick=async()=>{if(!confirm("کد بازیابی جدید ساخته شود؟ کد قبلی باطل می‌شود."))return;const {data,error}=await sb.rpc("make_recovery_code");if(error)return toast("ساخته نشد");$("#detail").innerHTML=recoveryCard(data);$("#detail").scrollIntoView({behavior:"smooth"})};
  const {data:st}=await sb.from("profiles").select("id,full_name,username").eq("coach_id",me.id).order("created_at");
  const {data:ms}=await sb.from("memberships").select("*");
  const M={}; (ms||[]).forEach(m=>M[m.student_id]=m);
  const left=id=>{const m=M[id];return m&&m.total_sessions>0?m.total_sessions-m.used_sessions:null};
  const sel=$("#stsel");
  const fillSel=()=>{const cur=sel.value;
    sel.innerHTML=st&&st.length?'<option value="">انتخاب شاگرد…</option>'+st.map(x=>{const l=left(x.id);return `<option value="${x.id}">${esc(x.full_name)} — ${l===null?"جلسه تعیین نشده":num(Math.max(l,0))+" جلسه مانده"}</option>`}).join(""):'<option value="">هنوز شاگردی وصل نشده</option>';
    sel.value=cur};
  const show=()=>{
    const s=(st||[]).find(x=>x.id===sel.value), sp=$("#sp");
    if(!s){sp.innerHTML=st&&st.length?'<p class="mute">یک شاگرد را انتخاب کنید تا جلسه‌ها، برنامه و آمارش را ببینید.</p>':'<p class="mute">هنوز شاگردی وصل نشده. کد دعوت را برایشان بفرستید.</p>';return}
    const m=M[s.id]||{total_sessions:0,used_sessions:0}, l=m.total_sessions-m.used_sessions;
    sp.innerHTML=`<div class="stats" style="margin-top:12px"><div class="stat"><b>${num(m.total_sessions)}</b><small>کل جلسه</small></div><div class="stat"><b>${num(m.used_sessions)}</b><small>انجام‌شده</small></div><div class="stat ${m.total_sessions>0&&l<=2?"pr":""}"><b>${num(Math.max(l,0))}</b><small>باقی‌مانده</small></div></div>
    <div class="row"><button id="up" style="flex:1">+ یک جلسه انجام شد</button><button class="ghost" id="dn">برگردان</button></div>
    <label>تعداد کل جلسه‌ها</label>
    <div class="row"><input id="tot" type="number" min="0" inputmode="numeric" class="ltr" value="${m.total_sessions}"><button id="ts">ذخیره</button></div>
    <button class="ghost full" id="nw">بسته‌ی جدید (انجام‌شده‌ها صفر شود)</button>
    <div class="two" style="margin-top:14px"><button class="ghost" id="ba">آمار کل</button><button class="ghost" id="bs">آمار یک حرکت</button><button class="ghost" id="bp">برنامه تمرین</button><button class="ghost" id="bd">رژیم و غذاها</button></div>
    <button class="ghost full" id="bpw">تغییر رمز شاگرد</button></div>`;
    const save=async(t,u)=>{
      const r={student_id:s.id,total_sessions:Math.max(t,0),used_sessions:Math.max(u,0),updated_at:new Date().toISOString()};
      const {error}=await sb.from("memberships").upsert(r);
      if(error) return toast("ذخیره نشد");
      M[s.id]=r; fillSel(); show(); toast("ذخیره شد ✓");
    };
    const tot=()=>{const t=parseInt($("#tot").value);if(isNaN(t)||t<0){toast("عدد معتبر وارد کنید");return null}return t};
    $("#up").onclick=()=>{if(!m.total_sessions)return toast("اول تعداد کل جلسه‌ها را مشخص کنید");if(l<=0)return toast("جلسه‌ها تمام شده؛ بسته‌ی جدید بسازید");save(m.total_sessions,m.used_sessions+1)};
    $("#dn").onclick=()=>save(m.total_sessions,m.used_sessions-1);
    $("#ts").onclick=()=>{const t=tot();if(t!==null)save(t,Math.min(m.used_sessions,t))};
    $("#nw").onclick=()=>{const t=tot();if(t!==null)save(t,0)};
    const open=k=>{const T={pl:"برنامه",st:"آمار حرکت‌های",al:"آمار کل",di:"رژیم و غذاهای"};
      const hr='<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">';
      $("#detail").innerHTML=`<div class="card"><h2>${T[k]} ${esc(s.full_name)}</h2>${k==="al"?'<div id="ox"></div>'+hr+'<div id="wx"></div>'+hr:""}<div id="sx"></div></div>`;
      if(k==="pl")planEditor($("#sx"),s.id);else if(k==="di")dietEditor($("#sx"),s.id);else if(k==="al"){overviewView($("#ox"),s.id);weightView($("#wx"),s.id,false);allStatsView($("#sx"),s.id)}else statsView($("#sx"),s.id);
      $("#detail").scrollIntoView({behavior:"smooth"})};
    $("#bp").onclick=()=>open("pl"); $("#bs").onclick=()=>open("st"); $("#bd").onclick=()=>open("di"); $("#ba").onclick=()=>open("al");
    $("#bpw").onclick=async()=>{const pw=prompt("رمز جدید برای "+s.full_name+" (حداقل ۶ کاراکتر)");if(!pw)return;const {data,error}=await sb.rpc("coach_set_password",{p_student:s.id,p_password:pw});toast(error?"انجام نشد":data==="ok"?"رمز تغییر کرد ✓":data==="short"?"رمز کوتاه است":"مجاز نیست")};
  };
  sel.onchange=()=>{$("#detail").innerHTML="";show()};
  fillSel(); show();
}

/* ---------- نمای شاگرد ---------- */
function studentView(tab="log",pre=null){
  const items=[["log","ثبت تمرین"],["st","پیشرفت من"],...(me.role==="self"?[]:[["pl","برنامه من"]]),["di","رژیم غذایی"]];
  app.innerHTML=`<header><h1>سلام ${esc(me.full_name)}</h1><button class="ghost" id="mn" aria-label="منو">☰</button></header>
  <div class="dr-bg" id="drb"></div><nav class="dr" id="dr"><h2>منو</h2>${items.map(([k,t])=>`<button class="${tab===k?"":"ghost"}" data-t="${k}">${t}</button>`).join("")}<button class="ghost" id="rcd">کد بازیابی رمز</button><button class="ghost" id="out" style="margin-top:auto">خروج</button></nav>
  <div id="mem"></div><div id="body"></div>`;
  const tg=o=>{$("#dr").classList.toggle("open",o);$("#drb").classList.toggle("open",o)};
  $("#mn").onclick=()=>tg(true); $("#drb").onclick=()=>tg(false);
  bindOut(); if(me.role!=="self") memBanner();
  $("#rcd").onclick=async()=>{tg(false);if(!confirm("کد بازیابی جدید ساخته شود؟ کد قبلی باطل می‌شود."))return;const {data,error}=await sb.rpc("make_recovery_code");if(error)return toast("ساخته نشد");$("#body").innerHTML=recoveryCard(data)};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>studentView(b.dataset.t));
  if(tab==="st"){$("#body").innerHTML='<div class="card" id="ox"></div><div class="card" id="wx"></div><div class="card" id="sx"></div>'; overviewView($("#ox"),me.id); weightView($("#wx"),me.id,true); statsView($("#sx"),me.id)}
  else if(tab==="pl") planView(); else if(tab==="di") dietView(); else logView(pre);
}
function hint(row){
  const w=parseFloat(row.querySelector(".w").value), r=parseInt(row.querySelector(".r").value), h=row.querySelector(".hint");
  if(!(w>0)||!(r>0)){h.textContent="";return}
  const st=w>=60?5:2.5;
  h.textContent=r>=12?`پیشنهاد ست بعد: ${num(w+st)} کیلو`:r<=5?`سنگین بود؛ پیشنهاد: ${num(Math.max(w-st,0))} کیلو`:`همین وزن را ادامه بده`;
}
function setRow(i,w="",r=""){
  return `<div class="row" data-set><span>ست ${num(i)}</span>
  <div style="flex:1"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="کیلو" class="w ltr" value="${w}"><small class="hint"></small></div>
  <input type="number" inputmode="numeric" min="1" placeholder="تکرار" class="r ltr" value="${r}"></div>`;
}
function logView(pre=null){
  if(!EX.length){$("#body").innerHTML='<div class="card">هنوز حرکتی تعریف نشده. از مربی بخواهید حرکت اضافه کند.</div>';return}
  $("#body").innerHTML=`<div class="card"><h2>تمرین جدید</h2>
  <label>تاریخ</label><input type="date" id="dt" class="ltr" value="${today()}">
  ${filt("eq","mg","q")}

  <div id="sets">${setRow(1)}</div>

  <button class="full" id="save">ذخیره</button></div>

  $("#add").onclick=()=>{

    $("#sets").insertAdjacentHTML("beforeend",setRow(rows.length+1,last.querySelector(".w").value,last.querySelector(".r").value));hint($("#sets").lastElementChild);

async function saveSets(){
  const date=$("#dt").value, exId=+$("#ex").value;
  const rows=[...document.querySelectorAll("[data-set]")].map(r=>({w:parseFloat(r.querySelector(".w").value),r:parseInt(r.querySelector(".r").value)})).filter(x=>x.w>=0&&x.r>0);
  if(!date||!exId||!rows.length) return toast("وزنه و تکرار را وارد کنید");
  $("#save").disabled=true;
  let {data:w}=await sb.from("workouts").select("id").eq("student_id",me.id).eq("workout_date",date).limit(1);
  let wid=w&&w[0]?w[0].id:null;
  if(!wid){const {data:n,error}=await sb.from("workouts").insert({student_id:me.id,workout_date:date}).select("id").single();
    if(error){$("#save").disabled=false;return toast("ذخیره نشد")} wid=n.id}
  const {count}=await sb.from("sets").select("id",{count:"exact",head:true}).eq("workout_id",wid).eq("exercise_id",exId);
  const {error}=await sb.from("sets").insert(rows.map((x,i)=>({workout_id:wid,exercise_id:exId,set_number:(count||0)+i+1,weight_kg:x.w,reps:x.r})));
  $("#save").disabled=false;
  if(error) return toast("ذخیره نشد");
  toast("ذخیره شد ✓"); $("#sets").innerHTML=setRow(1); loadHist();
}
async function loadHist(){
  const {data}=await sb.from("sets").select("weight_kg,reps,set_number,exercises(name),workouts!inner(workout_date)").order("id",{ascending:false}).limit(12);
  $("#hist").innerHTML=data&&data.length?data.map(s=>`<li><span>${esc(s.exercises.name)} <span class="mute">${fa(s.workouts.workout_date)}</span></span><span>${num(s.weight_kg)} کیلو × ${num(s.reps)}</span></li>`).join(""):'<li class="mute">هنوز ستی ثبت نشده.</li>';
}

function statsView(el,sid){

  el.innerHTML=`${filt("sx-eq","sx-mg","sx-q")}<label>حرکت</label><select id="sx-ex">${exOptions()}</select><div id="sx-out" style="margin-top:12px"></div>`;
  const draw=async()=>{
    charts.forEach(c=>c.destroy()); charts=[];
    const out=$("#sx-out");
    if(!$("#sx-ex").value){out.innerHTML='<p class="mute">حرکتی در این دسته نیست.</p>';return}
    out.innerHTML='<p class="mute">در حال بارگذاری…</p>';
    const {data,error}=await sb.from("sets").select("set_number,weight_kg,reps,workouts!inner(workout_date,student_id)").eq("exercise_id",+$("#sx-ex").value).eq("workouts.student_id",sid);
    if(error||!data.length){out.innerHTML='<p class="mute">برای این حرکت هنوز داده‌ای ثبت نشده.</p>';return}
    const by={}; data.forEach(s=>{const d=s.workouts.workout_date,o=by[d]||(by[d]={max:0,vol:0,reps:0,sets:[]});
      o.max=Math.max(o.max,+s.weight_kg);o.vol+=s.weight_kg*s.reps;o.reps+=s.reps;o.sets.push(s)});
    const days=Object.keys(by).sort(), pr=Math.max(...days.map(d=>by[d].max)), tv=days.reduce((a,d)=>a+by[d].vol,0);
    const span=Math.round((D0(days[days.length-1])-D0(days[0]))/864e5);
    const css=getComputedStyle(document.documentElement), acc=css.getPropertyValue("--acc").trim(), pc=css.getPropertyValue("--pr").trim();
    out.innerHTML=`<div class="stats"><div class="stat pr"><b>${num(pr)}</b><small>رکورد (کیلو)</small></div><div class="stat"><b>${num(days.length)}</b><small>روز تمرین</small></div><div class="stat"><b>${num(Math.round(tv))}</b><small>حجم کل</small></div></div>
    <p class="desc">از ${fa(days[0])} تا ${fa(days[days.length-1])} (${num(span)} روز). فاصله‌ی نقطه‌ها روی نمودارها با فاصله‌ی واقعی روزها برابر است.</p>
    <h2>بیشترین وزنه هر روز</h2><p class="desc">سنگین‌ترین وزنه‌ای که در هر روز برای این حرکت زده شده. محور افقی تاریخ و محور عمودی وزنه به کیلو است. بالا رفتن خط یعنی قوی‌تر شدن.</p><canvas id="c1"></canvas>
    <h2 style="margin-top:16px">حجم تمرین هر روز</h2><p class="desc">حجم یعنی وزنه ضرب در تکرار برای همه‌ی ست‌های آن روز. نشان می‌دهد در هر روز چقدر کار انجام شده. بالا رفتن آن یعنی تمرین سنگین‌تر یا بیشتر شده.</p><canvas id="c2"></canvas>
    <h2 style="margin-top:16px">مجموع تکرار هر روز</h2><p class="desc">جمع تکرار همه‌ی ست‌های هر روز. اگر وزنه ثابت است و تکرار بالا می‌رود، پیشرفت داری و وقت زیاد کردن وزنه است.</p><canvas id="c3"></canvas>
    <h2 style="margin-top:16px">تکرار هر ست در هر روز</h2><p class="desc">وزنه × تکرار هر ست، به ترتیب ست.</p>
    <ul class="list">${days.slice().reverse().map(d=>`<li><span>${fa(d)}</span><span>${by[d].sets.sort((a,b)=>a.set_number-b.set_number).map(x=>`${num(x.weight_kg)}×${num(x.reps)}`).join(" | ")}</span></li>`).join("")}</ul>`;
    charts.push(mkChart($("#c1"),{days,vals:days.map(d=>by[d].max),color:acc,yTitle:"وزنه (کیلو)",unit:"کیلو"}));
    charts.push(mkChart($("#c2"),{days,vals:days.map(d=>Math.round(by[d].vol)),color:acc,yTitle:"حجم (وزنه × تکرار)",unit:""}));
    charts.push(mkChart($("#c3"),{days,vals:days.map(d=>by[d].reps),color:pc,yTitle:"تعداد تکرار",unit:"تکرار"}));
  };

  $("#sx-ex").onchange=draw; draw();
}

    if(window._wc) window._wc.destroy();

  }

/* ---------- رژیم غذایی ---------- */
const FOODS=[
["سینه مرغ|سینه‌مرغ",165,{p:150}],["مرغ",190,{p:150}],["تخم مرغ|تخم‌مرغ",155,{p:50}],["گوشت|استیک",250,{p:150}],["کباب",250,{p:100}],["ماهی|سالمون",150,{p:150}],["تن ماهی",130,{c:120}],
["برنج|پلو|چلو",130,{s:30,c:150,b:250}],["ماکارونی|پاستا",150,{s:25,c:150,b:250}],["نان",270,{p:60,t:30}],["سنگک",270,{p:100,t:50}],["لواش",270,{p:40}],["بربری",270,{p:90}],
["سیب زمینی|سیب‌زمینی",90,{p:150,s:30}],["عدس|لوبیا|نخود",120,{s:25,c:150,b:250}],["شیر",60,{l:250,c:200}],["ماست",60,{s:20,c:150}],["پنیر",300,{s:15,p:30}],
["کره بادام زمینی",590,{s:16}],["کره",720,{s:15}],["روغن",884,{s:13}],["عسل",304,{s:20}],["شکر",387,{s:10}],["موز",89,{p:120}],["سیب",52,{p:180}],["پرتقال",47,{p:150}],
["خرما",282,{p:8}],["بادام",575,{p:1.2,h:30,s:15}],["گردو",654,{p:5,h:30}],["پروتئین",400,{p:30,s:30}],["جو دوسر|یولاف",380,{s:10,c:40}],["سالاد|خیار|گوجه",20,{p:100,c:100,b:200}]];
const UN=[[/چای\s*خوری/,"s",.33],[/قاشق/,"s",1],[/لیوان/,"l",1],[/کاسه|پیمانه|فنجان/,"c",1],[/بشقاب/,"b",1],[/مشت/,"h",1],[/تکه|برش|کف دست/,"t",1],[/عدد|دانه|تا\b/,"p",1]];
const NW={"نیم":.5,"یک":1,"دو":2,"سه":3,"چهار":4,"پنج":5,"شش":6,"هفت":7,"هشت":8,"نه":9,"ده":10};
function calcKcal(text){
  let kcal=0; const miss=[];
  text.replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c)).split(/[،,\n+]|\sو\s|\sبا\s/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    let n=parseFloat((part.match(/\d+(?:\.\d+)?/)||[])[0]);
    if(isNaN(n)){const w=part.split(/\s+/).find(x=>NW[x]!==undefined);n=w?NW[w]:1}
    let best=null,bl=0; FOODS.forEach(f=>f[0].split("|").forEach(k=>{if(part.includes(k)&&k.length>bl){best=f;bl=k.length}}));
    if(!best){miss.push(part);return}
    let g;
    if(/کیلو/.test(part)) g=n*1000;
    else if(/گرم|گر\b/.test(part)) g=n;
    else{const u=UN.find(x=>x[0].test(part)); g=n*(best[2][u?u[1]:"p"]??best[2].p??100)*(u?u[2]:1)}
    kcal+=g*best[1]/100;
  });
  return {kcal:Math.round(kcal),miss};
}

/* ---------- نمودار بر اساس روز واقعی ---------- */
const D0=d=>new Date(d+"T12:00:00");
function mkChart(cv,o){
  const css=getComputedStyle(document.documentElement), grid=css.getPropertyValue("--line").trim(), txt=css.getPropertyValue("--mute").trim(), b=D0(o.days[0]);
  const pts=o.days.map((d,i)=>({x:Math.round((D0(d)-b)/864e5),y:o.vals[i]}));
  return new Chart(cv,{type:"line",data:{datasets:[{data:pts,borderColor:o.color,backgroundColor:o.color+"33",fill:true,tension:.25,pointRadius:4}]},
    options:{parsing:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>fa(new Date(b.getTime()+i[0].parsed.x*864e5)),label:i=>`${num(i.parsed.y)} ${o.unit}`}}},
    scales:{x:{type:"linear",title:{display:true,text:"تاریخ",color:txt},ticks:{color:txt,maxTicksLimit:6,callback:v=>new Date(b.getTime()+Math.round(v)*864e5).toLocaleDateString("fa-IR",{month:"short",day:"numeric"})},grid:{color:grid}},
    y:{title:{display:true,text:o.yTitle,color:txt},ticks:{color:txt},grid:{color:grid}}}}});
}

/* ---------- آمار کل شاگرد ---------- */
async function allStatsView(el,sid){
  el.innerHTML='<p class="mute">در حال بارگذاری…</p>';
  const {data,error}=await sb.from("sets").select("set_number,weight_kg,reps,exercise_id,exercises(name,name_en),workouts!inner(workout_date,notes,student_id)").eq("workouts.student_id",sid).order("id");
  if(error||!data.length){el.innerHTML='<p class="mute">هنوز تمرینی ثبت نشده.</p>';return}
  const E={},Dy={};
  data.forEach(s=>{const d=s.workouts.workout_date,id=s.exercise_id;
    const e=E[id]||(E[id]={n:s.exercises,days:{}}); (e.days[d]=e.days[d]||[]).push(s);
    const dd=Dy[d]||(Dy[d]={note:s.workouts.notes||"",ex:{}}); (dd.ex[id]=dd.ex[id]||{n:s.exercises,sets:[]}).sets.push(s)});
  const mx=a=>Math.max(...a.map(x=>+x.weight_kg));
  const rows=Object.values(E).map(e=>{const ds=Object.keys(e.days).sort(),f=mx(e.days[ds[0]]),l=mx(e.days[ds[ds.length-1]]);return {n:e.n,c:ds.length,pr:Math.max(...ds.map(d=>mx(e.days[d]))),ch:+(l-f).toFixed(1)}}).sort((a,b)=>b.c-a.c);
  const keys=Object.keys(Dy).sort(), st=x=>x.sort((a,b)=>a.set_number-b.set_number).map(y=>`${num(y.weight_kg)}×${num(y.reps)}`).join(" | ");
  el.innerHTML=`<h2>همه‌ی حرکت‌ها</h2><p class="desc">برای هر حرکت: تعداد روزی که انجام شده، رکورد وزنه و تغییر وزنه‌ی سنگین‌ترین ست از اولین تا آخرین روز.</p>
  <div style="overflow-x:auto"><table><tr><th>حرکت</th><th>روز</th><th>رکورد</th><th>تغییر</th></tr>${rows.map(r=>`<tr><td>${esc(r.n.name)}</td><td>${num(r.c)}</td><td>${num(r.pr)}</td><td>${r.ch>0?"+":""}${num(r.ch)}</td></tr>`).join("")}</table></div>
  <h2 style="margin-top:16px">ثبت هر روز، ست به ست</h2><p class="desc">روی هر روز بزن تا وزنه × تکرار هر ست هر حرکت را ببینی.</p>
  ${keys.map((d,i)=>[d,i]).reverse().map(([d,i])=>`<details><summary>روز ${num(i+1)} | ${fa(d)} ${esc(Dy[d].note)}</summary>${Object.values(Dy[d].ex).map(x=>`<div style="margin:8px 0">${esc(x.n.name)}<div class="mute">${st(x.sets)}</div></div>`).join("")}</details>`).join("")}`;
}

/* ---------- کد بازیابی و فراموشی رمز ---------- */
function recoveryCard(c){return `<div class="card"><h2>کد بازیابی رمز شما</h2><div class="code" style="font-size:1.8rem">${esc(c)}</div><p class="mute">این کد را جای امنی ذخیره کن (عکس یا یادداشت). فقط همین حالا نمایش داده می‌شود و برای فراموشی رمز لازم است.</p></div>`}
function forgotView(){
  document.body.classList.add("auth-bg");
  app.innerHTML=`<div class="neon" style="font-size:2rem">GYMNASION</div><div class="card"><h2>فراموشی رمز عبور</h2>
  <p class="mute">نام کاربری، کد بازیابی که هنگام ثبت‌نام گرفتی و رمز جدید را بنویس. اگر شاگرد هستی و کد نداری، از مربی‌ات بخواه رمزت را تغییر بدهد.</p>
  <label>نام کاربری</label><input id="fu" class="ltr" autocapitalize="none"><label>کد بازیابی</label><input id="fc" class="ltr" autocapitalize="characters">
  <label>رمز جدید (حداقل ۶ کاراکتر)</label><input id="fp" type="password" class="ltr"><div class="err" id="fe"></div>
  <button class="full" id="fg2">تغییر رمز</button><p class="mute" style="text-align:center;font-size:.8rem;margin:14px 0 0"><a href="#" id="bk">بازگشت به ورود</a></p></div>`;
  $("#bk").onclick=e=>{e.preventDefault();authView()};
  $("#fg2").onclick=async()=>{
    const {data,error}=await sb.rpc("reset_password_with_code",{p_username:$("#fu").value,p_code:$("#fc").value,p_password:$("#fp").value});
    const M={bad:"نام کاربری یا کد اشتباه است.",locked:"بیش از حد تلاش شد؛ از مربی کمک بگیر.",short:"رمز باید حداقل ۶ کاراکتر باشد."};
    if(error){$("#fe").textContent="ارتباط برقرار نشد";return}
    if(data==="ok"){toast("رمز تغییر کرد؛ حالا وارد شو");authView()} else $("#fe").textContent=M[data]||"انجام نشد";
  };
}
