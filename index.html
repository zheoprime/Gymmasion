<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر تمرین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#66737f;--line:#d5dbe1;--acc:#1f5eff;--acc-ink:#fff;--pr:#e8472b}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--ink:#e8edf1;--mute:#93a0ac;--line:#2a3743;--acc:#5b8cff;--acc-ink:#0b1220;--pr:#ff7a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.full{width:100%;margin-top:14px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row span{min-width:44px;color:var(--mute);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}.stat small{color:var(--mute)}
.stat.pr b{color:var(--pr)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list li:last-child{border:0}
.list .a{cursor:pointer;color:var(--acc);font-weight:600}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.2em;direction:ltr;display:inline-block;color:var(--acc)}
.err{color:var(--pr);font-size:.9rem;min-height:1.4em;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.mute{color:var(--mute);font-size:.9rem}
canvas{max-height:220px}
.ltr{direction:ltr}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ====== تنظیمات: این دو مقدار را عوض کنید ====== */
const SUPABASE_URL = "https://kywaoprjmsprkewoctfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y80j1Eh4WRYGO5_Fy8MSpw_49djTcBB";   // publishable key
/* ================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = d => new Date(d).toLocaleDateString("fa-IR");
const num = n => Number(n).toLocaleString("fa-IR");
const mail = u => `${u.trim().toLowerCase()}@gymapp.app`;
const app = $("#app");
let me = null, EX = [], charts = [];

function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ---------- ورود / ثبت‌نام ---------- */
function authView(mode="login", role="student"){
  const reg = mode==="register";
  app.innerHTML = `
  <header><h1>دفتر تمرین</h1></header>
  ${!SUPABASE_KEY.startsWith("sb_")?'<div class="card err">کلید anon در فایل تنظیم نشده است.</div>':''}
  <div class="card">
    <div class="seg"><button class="${reg?'ghost':''}" id="tl">ورود</button><button class="${reg?'':'ghost'}" id="tr">ثبت‌نام</button></div>
    ${reg?`<label>نقش</label><div class="seg"><button class="${role==='student'?'':'ghost'}" id="rs">شاگرد</button><button class="${role==='coach'?'':'ghost'}" id="rc">مربی</button></div>
    <label>نام و نام خانوادگی</label><input id="fn" autocomplete="name">`:''}
    <label>نام کاربری (انگلیسی)</label><input id="un" class="ltr" autocomplete="username" autocapitalize="none">
    <label>رمز عبور (حداقل ۶ کاراکتر)</label><input id="pw" type="password" class="ltr" autocomplete="${reg?'new-password':'current-password'}">
    ${reg&&role==='student'?'<label>کد دعوت مربی</label><input id="ic" class="ltr" autocapitalize="characters">':''}
    <div class="err" id="er"></div>
    <button class="full" id="go">${reg?'ساخت حساب':'ورود'}</button>
  </div>`;
  $("#tl").onclick=()=>authView("login"); $("#tr").onclick=()=>authView("register",role);
  if(reg){$("#rs").onclick=()=>authView("register","student");$("#rc").onclick=()=>authView("register","coach")}
  $("#go").onclick=async()=>{
    const er=$("#er"); er.textContent=""; const un=$("#un").value, pw=$("#pw").value;
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(un)){er.textContent="نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا _ باشد.";return}
    if(pw.length<6){er.textContent="رمز عبور باید حداقل ۶ کاراکتر باشد.";return}
    $("#go").disabled=true;
    let r;
    if(reg){
      const fn=$("#fn").value.trim(); if(!fn){er.textContent="نام را وارد کنید.";$("#go").disabled=false;return}
      const ic=role==='student'?$("#ic").value.trim():"";
      if(role==='student'&&!ic){er.textContent="کد دعوت را از مربی بگیرید.";$("#go").disabled=false;return}
      r=await sb.auth.signUp({email:mail(un),password:pw,options:{data:{username:un,full_name:fn,role,invite_code:ic}}});
      if(r.error) r.error={message:"Sign-up failed: "+r.error.message};
      else if(!r.data.session){
        const l=await sb.auth.signInWithPassword({email:mail(un),password:pw});
        if(l.error) r.error={message:"Account created but login failed: "+l.error.message+" (Is Confirm email still ON in Supabase?)"};
      }
    } else {
      r=await sb.auth.signInWithPassword({email:mail(un),password:pw});
      if(r.error) r.error={message:"Login failed: "+r.error.message};
    }
    $("#go").disabled=false;
    if(r.error){er.textContent=r.error.message;return}
    boot();
  };
}

/* ---------- شروع ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return authView();
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!p){await sb.auth.signOut();return authView()}
  me=p;
  const {data:ex}=await sb.from("exercises").select("*").order("name"); EX=ex||[];
  me.role==="coach"?coachView():studentView();
}
const head = t => `<header><h1>${t}</h1><button class="ghost" id="out">خروج</button></header>`;
function bindOut(){$("#out").onclick=async()=>{await sb.auth.signOut();me=null;authView()}}
const exOptions = () => EX.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");

/* ---------- نمای مربی ---------- */
async function coachView(){
  app.innerHTML = head(`سلام مربی ${esc(me.full_name)}`)+`
  <div class="card"><h2>کد دعوت شما</h2><div class="code">${esc(me.invite_code)}</div>
  <p class="mute">این کد را به شاگردها بدهید تا هنگام ثبت‌نام وارد کنند.</p></div>
  <div class="card"><h2>شاگردها</h2><ul class="list" id="sl"><li class="mute">در حال بارگذاری…</li></ul></div>
  <div id="detail"></div>
  <div class="card"><h2>افزودن حرکت جدید</h2>
    <label>نام حرکت</label><input id="en"><label>عضله‌ی هدف</label><input id="em">
    <button class="full" id="ea">افزودن حرکت</button></div>`;
  bindOut();
  $("#ea").onclick=async()=>{
    const name=$("#en").value.trim(); if(!name) return;
    const {error}=await sb.from("exercises").insert({name,muscle_group:$("#em").value.trim(),created_by:me.id});
    if(error) return toast("افزودن حرکت انجام نشد");
    $("#en").value=$("#em").value="";
    const {data}=await sb.from("exercises").select("*").order("name"); EX=data||[]; toast("حرکت اضافه شد");
  };
  const {data:st}=await sb.from("profiles").select("id,full_name,username").eq("coach_id",me.id).order("created_at");
  $("#sl").innerHTML = st&&st.length ? st.map(s=>`<li><span>${esc(s.full_name)} <span class="mute ltr">@${esc(s.username)}</span></span><span class="a" data-id="${s.id}" data-n="${esc(s.full_name)}">مشاهده آمار</span></li>`).join("")
    : '<li class="mute">هنوز شاگردی وصل نشده. کد دعوت را برایشان بفرستید.</li>';
  document.querySelectorAll(".a").forEach(a=>a.onclick=()=>{
    $("#detail").innerHTML=`<div class="card"><h2>آمار ${a.dataset.n}</h2><div id="sx"></div></div>`;
    statsView($("#sx"),a.dataset.id); $("#detail").scrollIntoView({behavior:"smooth"});
  });
}

/* ---------- نمای شاگرد ---------- */
function studentView(tab="log"){
  app.innerHTML = head(`سلام ${esc(me.full_name)}`)+`
  <div class="tabs"><button class="${tab==='log'?'':'ghost'}" id="t1">ثبت تمرین</button><button class="${tab==='st'?'':'ghost'}" id="t2">پیشرفت من</button></div>
  <div id="body"></div>`;
  bindOut(); $("#t1").onclick=()=>studentView("log"); $("#t2").onclick=()=>studentView("st");
  if(tab==="st"){ $("#body").innerHTML='<div class="card" id="sx"></div>'; statsView($("#sx"),me.id); }
  else logView();
}

function setRow(i,w="",r=""){
  return `<div class="row" data-set><span>ست ${num(i)}</span>
  <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="کیلو" class="w ltr" value="${w}">
  <input type="number" inputmode="numeric" min="1" placeholder="تکرار" class="r ltr" value="${r}"></div>`;
}
function logView(){
  if(!EX.length){$("#body").innerHTML='<div class="card">هنوز حرکتی تعریف نشده. از مربی بخواهید حرکت اضافه کند.</div>';return}
  $("#body").innerHTML=`<div class="card"><h2>تمرین جدید</h2>
  <label>تاریخ</label><input type="date" id="dt" class="ltr" value="${new Date().toISOString().slice(0,10)}">
  <label>حرکت</label><select id="ex">${exOptions()}</select>
  <div id="sets">${setRow(1)}</div>
  <button class="ghost full" id="add">+ ست جدید</button>
  <button class="full" id="save">ذخیره</button></div>
  <div class="card"><h2>آخرین ست‌ها</h2><ul class="list" id="hist"></ul></div>`;
  $("#add").onclick=()=>{
    const rows=document.querySelectorAll("[data-set]"), last=rows[rows.length-1];
    $("#sets").insertAdjacentHTML("beforeend",setRow(rows.length+1,last.querySelector(".w").value,last.querySelector(".r").value));
  };
  $("#save").onclick=saveSets; loadHist();
}
async function saveSets(){
  const date=$("#dt").value, exId=+$("#ex").value;
  const rows=[...document.querySelectorAll("[data-set]")].map(r=>({w:parseFloat(r.querySelector(".w").value),r:parseInt(r.querySelector(".r").value)})).filter(x=>x.w>=0&&x.r>0);
  if(!date||!rows.length) return toast("وزنه و تکرار را وارد کنید");
  $("#save").disabled=true;
  let {data:w}=await sb.from("workouts").select("id").eq("student_id",me.id).eq("workout_date",date).limit(1);
  let wid=w&&w[0]?w[0].id:null;
  if(!wid){const {data:n,error}=await sb.from("workouts").insert({student_id:me.id,workout_date:date}).select("id").single();
    if(error){$("#save").disabled=false;return toast("ذخیره نشد")} wid=n.id}
  const {count}=await sb.from("sets").select("id",{count:"exact",head:true}).eq("workout_id",wid).eq("exercise_id",exId);
  const {error}=await sb.from("sets").insert(rows.map((x,i)=>({workout_id:wid,exercise_id:exId,set_number:(count||0)+i+1,weight_kg:x.w,reps:x.r})));
  $("#save").disabled=false;
  if(error) return toast("ذخیره نشد");
  toast("ذخیره شد ✓"); $("#sets").innerHTML=setRow(1); loadHist();
}
async function loadHist(){
  const {data}=await sb.from("sets").select("weight_kg,reps,set_number,exercises(name),workouts!inner(workout_date)").order("id",{ascending:false}).limit(12);
  $("#hist").innerHTML=data&&data.length?data.map(s=>`<li><span>${esc(s.exercises.name)} <span class="mute">${fa(s.workouts.workout_date)}</span></span><span>${num(s.weight_kg)} کیلو × ${num(s.reps)}</span></li>`).join(""):'<li class="mute">هنوز ستی ثبت نشده.</li>';
}

/* ---------- آمار و نمودار ---------- */
function statsView(el,sid){
  if(!EX.length){el.innerHTML='<p class="mute">حرکتی تعریف نشده.</p>';return}
  el.innerHTML=`<label>حرکت</label><select id="sx-ex">${exOptions()}</select><div id="sx-out" style="margin-top:12px"></div>`;
  const draw=async()=>{
    charts.forEach(c=>c.destroy()); charts=[];
    const out=$("#sx-out"); out.innerHTML='<p class="mute">در حال بارگذاری…</p>';
    const {data,error}=await sb.from("sets").select("weight_kg,reps,workouts!inner(workout_date,student_id)").eq("exercise_id",+$("#sx-ex").value).eq("workouts.student_id",sid);
    if(error||!data.length){out.innerHTML='<p class="mute">برای این حرکت هنوز داده‌ای ثبت نشده.</p>';return}
    const by={}; data.forEach(s=>{const d=s.workouts.workout_date,o=by[d]||(by[d]={max:0,vol:0,reps:0});
      o.max=Math.max(o.max,+s.weight_kg);o.vol+=s.weight_kg*s.reps;o.reps+=s.reps});
    const days=Object.keys(by).sort(), labels=days.map(fa);
    const pr=Math.max(...days.map(d=>by[d].max)), tv=days.reduce((a,d)=>a+by[d].vol,0);
    out.innerHTML=`<div class="stats"><div class="stat pr"><b>${num(pr)}</b><small>رکورد (کیلو)</small></div>
      <div class="stat"><b>${num(days.length)}</b><small>جلسه</small></div>
      <div class="stat"><b>${num(Math.round(tv))}</b><small>حجم کل</small></div></div>
      <h2>بیشترین وزنه هر جلسه (کیلو)</h2><canvas id="c1"></canvas>
      <h2 style="margin-top:16px">حجم تمرین (وزنه × تکرار)</h2><canvas id="c2"></canvas>
      <h2 style="margin-top:16px">مجموع تکرار</h2><canvas id="c3"></canvas>`;
    const css=getComputedStyle(document.documentElement), acc=css.getPropertyValue("--acc").trim(), grid=css.getPropertyValue("--line").trim(), txt=css.getPropertyValue("--mute").trim();
    const mk=(id,type,vals,color)=>charts.push(new Chart($(id),{type,data:{labels,datasets:[{data:vals,borderColor:color,backgroundColor:color+(type==="bar"?"":"33"),tension:.25,fill:type==="line",pointRadius:4}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:txt},grid:{color:grid}},y:{ticks:{color:txt},grid:{color:grid},beginAtZero:type==="bar"}}}}));
    mk("#c1","line",days.map(d=>by[d].max),acc);
    mk("#c2","bar",days.map(d=>by[d].vol),acc);
    mk("#c3","line",days.map(d=>by[d].reps),css.getPropertyValue("--pr").trim());
  };
  $("#sx-ex").onchange=draw; draw();
}

boot();
</script>
</body>
</html>
